[project]
name = "pseudonymization-tool"
version = "5.2.1"
description = "Local pseudonymization tool for sensitive data in documents"
requires-python = ">=3.11"

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
]
filterwarnings = [
    # DeprecationWarning da starlette.testclient per cookies= per-request.
    # Viene da starlette internamente, non dal nostro codice.
    # Fix upstream: https://github.com/encode/starlette/issues/2549
    # Rimuovere questo filtro quando starlette >= 0.37 sarà disponibile.
    "ignore:Setting per-request cookies.*:DeprecationWarning:starlette",
    # DeprecationWarning da anyio/asyncio per Future.cancel(msg=...) e Task.cancel(msg=...) in Python 3.11+.
    # Viene da anyio e dalla stdlib asyncio internamente, non dal nostro codice.
    # Fix upstream: aggiornare anyio quando supporta Python 3.11+ natively.
    "ignore:Passing 'msg' argument to Future.cancel.*:DeprecationWarning",
    "ignore:Passing 'msg' argument to Task.cancel.*:DeprecationWarning",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
