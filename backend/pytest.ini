[pytest]
asyncio_mode = auto
# Marker definitions
markers =
    integration: marks tests as integration tests requiring external services (deselect with '-m "not integration"')
    slow: marks tests as slow-running

# Exclude integration tests by default (require docker-compose and external services).
# Run integration tests explicitly with: pytest -m integration
addopts = -m "not integration"

# Warning filters
# Suppress DeprecationWarning from anyio/_backends/_asyncio.py and asyncio/events.py
# caused by anyio passing the 'msg' argument to Task.cancel() / Future.cancel(),
# which is deprecated since Python 3.11 (scheduled for removal in Python 3.14).
# This is a known upstream issue in anyio 4.x (tracked at github.com/agronholm/anyio).
# Not actionable in our codebase — will be resolved when anyio releases a fix.
# See: https://github.com/agronholm/anyio/issues/XXX
# Suppress DeprecationWarning from pytest_asyncio plugin internals (event loop management).
# This is a known upstream issue in pytest-asyncio < 0.24 with Python 3.11+.
filterwarnings =
    error
    ignore::DeprecationWarning:anyio._backends._asyncio
    ignore::DeprecationWarning:asyncio.events
    ignore::DeprecationWarning:pytest_asyncio
