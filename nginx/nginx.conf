# ═══════════════════════════════════════════════════════════════════════════════
# nginx — Reverse Proxy + TLS Termination
# Pseudonymization Tool v5.0.0
# ═══════════════════════════════════════════════════════════════════════════════
#
# Funzioni:
#   - TLS termination (HTTPS → HTTP verso il backend uvicorn)
#   - Rate limiting a livello nginx (prima che la richiesta raggiunga Python)
#   - Forwarding degli header X-Forwarded-For / X-Real-IP
#   - Timeout e buffer configurati per upload di file grandi
#   - Redirect automatico HTTP → HTTPS
#
# Prerequisiti:
#   - Certificati TLS in /etc/nginx/certs/fullchain.pem e privkey.pem
#   - Per sviluppo locale: generare con scripts/generate-dev-certs.sh
#   - Per produzione: usare Let's Encrypt (certbot) o certificati aziendali
#
# ═══════════════════════════════════════════════════════════════════════════════

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # ─── Performance ──────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;  # Non esporre la versione nginx negli header

    # ─── Upload size (allineato a MAX_UPLOAD_FILES_PER_BATCH × dimensione max) ─
    client_max_body_size 200m;
    client_body_timeout 120s;
    client_header_timeout 30s;

    # ─── Rate limiting ────────────────────────────────────────────────────────
    # Zone per IP: 10 MB di memoria → ~160.000 IP tracciati
    # Limite: 30 richieste/secondo per IP (burst 60)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_status 429;

    # ─── Upstream: backend FastAPI ────────────────────────────────────────────
    upstream backend {
        server pseudonymization-tool:8000;
        keepalive 32;
    }

    # ─── Server: HTTP → HTTPS redirect ───────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ACME challenge per Let's Encrypt (se usato)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Tutto il resto: redirect permanente a HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── Server: HTTPS ────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # ── TLS ───────────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Solo TLS 1.2 e 1.3 (disabilita versioni obsolete)
        ssl_protocols TLSv1.2 TLSv1.3;

        # Cipher suite sicure (OWASP A2)
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        # Session cache TLS (performance)
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP stapling (riduce latenza handshake TLS)
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # ── Security headers ──────────────────────────────────────────────────
        # HSTS: forza HTTPS per 1 anno
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Timeout per operazioni pesanti (OCR, batch grandi) ────────────────
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # ── Proxy headers ─────────────────────────────────────────────────────
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";  # Abilita keepalive verso upstream

        # ── Endpoint di monitoring: no rate limit, no auth nginx ──────────────
        location /api/health {
            proxy_pass http://backend;
            access_log off;
        }

        location /api/ready {
            proxy_pass http://backend;
            access_log off;
        }

        # ── API: rate limiting ────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://backend;
        }

        # ── Frontend e tutto il resto ─────────────────────────────────────────
        location / {
            proxy_pass http://backend;
        }
    }
}
