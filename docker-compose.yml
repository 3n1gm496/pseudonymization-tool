# Docker Compose: Pseudonymization Tool v5.0.0
#
# SETUP INIZIALE:
#   1. cp .env.example .env
#   2. Modifica .env con valori sicuri (AUTH_PASSWORD, REDIS_PASSWORD, ecc.)
#   3. docker compose up --build -d
#
# Services:
#   - redis                 → Session storage + message broker per Celery (solo rete interna)
#   - pseudonymization-tool → FastAPI backend + frontend (multi-stage build)
#   - celery-worker         → Async task processor per scan/apply lunghi
#   - flower (opzionale)    → Dashboard Celery, attiva solo con: --profile monitoring
#
# Usage:
#   docker compose up --build -d                              # Start (senza Flower)
#   docker compose --profile monitoring up --build -d         # Start con Flower
#   docker compose down                                        # Stop & remove

services:
  # ─────────────────────────────────────────────────────────────────────────
  # Session Store + Message Broker per Celery
  # NOTA: nessuna porta esposta sull'host — accessibile solo internamente
  # ─────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pseudonymization-redis
    # Abilita autenticazione Redis con password da .env.
    # DECISIONE ARCHITETTURALE — Persistenza Redis (AOF/RDB):
    #   Redis gestisce dati VOLATILI per scelta consapevole:
    #   - Sessioni utente (TTL 8h, ricreate al login)
    #   - Broker Celery (task transitori)
    #   - Rate limiter (contatori a finestra mobile)
    #   I batch sono persistiti su filesystem (STATE_DIR), non su Redis.
    #   In caso di riavvio Redis, le sessioni vengono perse (re-login richiesto)
    #   ma i dati applicativi rimangono intatti su volume Docker.
    #   Per abilitare la durabilità AOF (ambienti con requisiti elevati):
    #     command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}",
    #               "--appendonly", "yes", "--appendfsync", "everysec"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    # Nessuna porta esposta sull'host: Redis è accessibile solo dai container
    # nella stessa rete Docker. Rimuove la superficie di attacco esterna.
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # FastAPI Backend + Frontend (multi-stage React build)
  # ─────────────────────────────────────────────────────────────────────────
  pseudonymization-tool:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pseudonymization-tool
    image: pseudonymization-tool:5.0.0

    ports:
      - "8000:8000"

    environment:
      PSEUDONYMIZER_PORT: "8000"
      # Stato applicativo su volume dedicato (non in /tmp)
      PSEUDONYMIZER_STATE_DIR: "/app/state"
      API_HEAVY_TIMEOUT_SECONDS: "180"
      MAX_UPLOAD_FILES_PER_BATCH: "20"
      MAX_CONSOLE_TEXT_CHARS: "200000"
      PYTHONUNBUFFERED: "1"
      # Profilo di deployment: dev | staging | prod
      # Controlla CORS, auth, log level, Swagger UI e CSRF protection.
      DEPLOYMENT_PROFILE: "${DEPLOYMENT_PROFILE:-prod}"
      AUTH_ENABLED: "true"
      AUTH_USERNAME: "${AUTH_USERNAME}"
      # AUTH_PASSWORD letta da .env — nessun default hardcoded
      AUTH_PASSWORD: "${AUTH_PASSWORD}"
      # Chiave HMAC per la firma dei token di sessione.
      # OBBLIGATORIA in PROD/STAGING: generare con: openssl rand -base64 48
      AUTH_SECRET: "${AUTH_SECRET}"
      # URL pubblico del frontend (allowed origin CORS in PROD).
      # OBBLIGATORIO in PROD: es. https://pseudonymizer.example.com
      PROD_FRONTEND_URL: "${PROD_FRONTEND_URL:-}"
      # Numero di worker uvicorn. Default 1 (sicuro con rate limiter in-memory).
      # Aumentare a 4 solo dopo aver abilitato il rate limiter Redis-backed (PR #36).
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-1}"
      # Redis con autenticazione
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@redis:6379/2"
      CELERY_WORKER_CONCURRENCY: "1"

    volumes:
      - ./backend/config:/app/backend/config:ro
      - ./output_samples:/app/output_samples
      - pseudonymizer_tmp:/tmp/pseudonymizer_batches
      - app_state:/app/state

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Celery Worker (Async task processor)
  # ─────────────────────────────────────────────────────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pseudonymization-celery-worker
    command: ["celery", "-A", "app.core.tasks", "worker", "--loglevel=info", "--concurrency=1"]

    environment:
      PYTHONUNBUFFERED: "1"
      PSEUDONYMIZER_STATE_DIR: "/app/state"
      DEPLOYMENT_PROFILE: "${DEPLOYMENT_PROFILE:-prod}"
      AUTH_SECRET: "${AUTH_SECRET}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@redis:6379/2"
      CELERY_WORKER_CONCURRENCY: "1"
      MAX_UPLOAD_FILES_PER_BATCH: "20"
      MAX_CONSOLE_TEXT_CHARS: "200000"

    volumes:
      - ./backend/config:/app/backend/config:ro
      - ./output_samples:/app/output_samples
      - pseudonymizer_tmp:/tmp/pseudonymizer_batches
      - app_state:/app/state

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Flower: Dashboard Celery (opzionale, solo profilo "monitoring")
  # Avviare con: docker compose --profile monitoring up -d
  # Dashboard: http://localhost:5555 (protetta da basic auth)
  # ─────────────────────────────────────────────────────────────────────────
  flower:
    image: mher/flower:2.0.1
    container_name: pseudonymization-flower
    profiles:
      - monitoring
    command:
      - "flower"
      - "--broker=redis://:${REDIS_PASSWORD}@redis:6379/1"
      - "--port=5555"
      - "--address=0.0.0.0"
      - "--basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}"
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@redis:6379/2"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

# Named volumes per persistenza
volumes:
  pseudonymizer_tmp:
    driver: local
  redis_data:
    driver: local
  app_state:
    driver: local
