name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r backend/requirements-dev.txt

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. Max line length 120
        flake8 backend/app --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Check code formatting with black
      run: |
        black --check backend/app

    - name: Sort imports with isort
      run: |
        isort --check-only backend/app

    - name: Security check with bandit
      run: |
        bandit -r backend/app -ll

    - name: Check for known security vulnerabilities
      run: |
        safety check --json || true

    - name: Run tests with pytest
      run: |
        cd backend
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=html --cov-report=term-missing --cov-fail-under=50

    - name: Coverage regression check for critical modules
      run: |
        cd backend
        # Check coverage for critical modules (fail if below thresholds)
        pytest tests/ --cov=app.core.pipeline --cov-report=term --cov-fail-under=20 -q
        pytest tests/ --cov=app.core.safety --cov-report=term --cov-fail-under=20 -q
        pytest tests/ --cov=app.pseudonymizer.transformer --cov-report=term --cov-fail-under=35 -q
        pytest tests/ --cov=app.core.exceptions --cov-report=term --cov-fail-under=55 -q
      continue-on-error: false

    - name: Check for untyped broad exceptions in critical paths
      run: |
        # Fail if "except Exception" found without comment justification in critical modules
        echo "Checking for broad exceptions in critical modules..."
        BROAD_EXCEPTIONS=$(grep -rn "except Exception" backend/app/core/pipeline.py backend/app/pseudonymizer/transformer.py backend/app/core/safety.py | grep -v "#" | grep -v "except Exception as" || true)
        if [ -n "$BROAD_EXCEPTIONS" ]; then
          echo "❌ Found untyped broad exceptions in critical modules:"
          echo "$BROAD_EXCEPTIONS"
          echo "Please use specific exception types or add justification comment."
          exit 1
        fi
        echo "✅ No untyped broad exceptions found in critical modules"
      continue-on-error: false

    - name: Run API contract tests
      run: |
        cd backend
        pytest tests/test_api_contract.py -v

    - name: Startup smoke test
      run: |
        cd backend
        python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
        UVICORN_PID=$!
        sleep 5
        curl -f http://127.0.0.1:8000/api/health
        curl -f http://127.0.0.1:8000/api/ready
        kill $UVICORN_PID || true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage.xml
        flags: unittests
        name: codecov-pseudonymization-tool
        fail_ci_if_error: false

  frontend-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi

    - name: Lint frontend
      run: |
        cd frontend
        npm run lint

    - name: Build frontend
      run: |
        cd frontend
        npm run build

  build:
    runs-on: ubuntu-latest
    needs: [test, frontend-check]

    steps:
    - uses: actions/checkout@v4

    - name: Validate project structure
      run: |
        test -f backend/requirements.txt
        test -f frontend/index.html
        test -f Makefile
        test -f docker-compose.yml
        test -f scripts/legacy/start.sh
        test -f README.md

    - name: Check for sensitive data
      run: |
        # Ensure no sensitive files are committed
        ! find . -name "*.env" -o -name "*.pem" -o -name "*.key" | grep -v ".venv" | grep -v "node_modules"
